services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "2048"
      SA_PASSWORD: "JobQueue!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'JobQueue!Passw0rd' -C -Q 'SELECT 1'"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 10s

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 10s

  # Phase 26: the HTTP entry point. Only creates and enqueues jobs; the workers
  # process them. Local URL: http://localhost:5208 (OpenAPI at /scalar/v1).
  api:
    build:
      context: .
      dockerfile: src/JobQueue.Api/Dockerfile
    ports:
      - "5208:8080"
    environment:
      ConnectionStrings__JobQueue: "Server=sqlserver,1433;Database=JobQueue;User Id=sa;Password=JobQueue!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true"
      RabbitMq__Host: "rabbitmq"
      Database__ApplyMigrationsOnStartup: "true"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Phase 26: background job processor. Scale out with:
  #   docker compose up -d --scale worker=3
  worker:
    build:
      context: .
      dockerfile: src/JobQueue.Worker/Dockerfile
    environment:
      ConnectionStrings__JobQueue: "Server=sqlserver,1433;Database=JobQueue;User Id=sa;Password=JobQueue!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  sqlserver_data:
  rabbitmq_data:
