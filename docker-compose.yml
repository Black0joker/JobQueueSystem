# Development infrastructure for the JobQueue system (Phase 6 - RabbitMQ).
#
# Usage:
#   docker compose up -d            # start SQL Server + RabbitMQ
#   docker compose up -d rabbitmq   # start only RabbitMQ (when using a local SQL Server)
#   docker compose down             # stop the containers (data volumes persist)
#
# SQL Server connection string for these containers:
#   Server=localhost,1433;Database=JobQueue;User Id=sa;Password=JobQueue!Passw0rd;TrustServerCertificate=True
#
# RabbitMQ management UI: http://localhost:15672 (guest/guest)

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jobqueue-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "JobQueue!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'JobQueue!Passw0rd' -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: jobqueue-rabbitmq
    hostname: jobqueue-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    ports:
      - "5672:5672"    # AMQP endpoint used by MassTransit
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  sqlserver-data:
  rabbitmq-data:
